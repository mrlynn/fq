# Generates FiscalQuarter.xcodeproj. After changing this file, run `xcodegen` in this directory.
# The generated project is committed, so opening FiscalQuarter.xcodeproj does not need xcodegen.
name: FiscalQuarter
options:
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"
    # The signing team. The App Group IDs in the entitlements are built from it on the Mac, and
    # SharedSettings.appGroup in FiscalQuarterCore/SharedSettings.swift must match. Change both together.
    DEVELOPMENT_TEAM: YZ36Z8GSEN

targets:
  FiscalQuarter:
    type: application
    platform: macOS
    sources:
      - path: FiscalQuarterApp
        excludes: [Info.plist, "*.entitlements"]
      - FiscalQuarterCore
      - FiscalQuarterUI
    dependencies:
      - target: FiscalQuarterWidgetMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fiscalquarter
        PRODUCT_NAME: FiscalQuarter
        INFOPLIST_FILE: FiscalQuarterApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fiscal Quarter
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        # Not sandboxed. The entitlement only lets the app share the App Group with the widget.
        CODE_SIGN_ENTITLEMENTS: FiscalQuarterApp/FiscalQuarter.entitlements
        # A team-prefixed App Group needs no provisioning profile on the Mac, so signing stays manual.
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  FiscalQuarterWidgetMac:
    type: app-extension
    platform: macOS
    productName: FiscalQuarterWidget
    deploymentTarget: "14.0"
    sources:
      - path: FiscalQuarterWidget
        excludes: [Info.plist, "*.entitlements"]
      - FiscalQuarterCore
      - FiscalQuarterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fiscalquarter.widget
        PRODUCT_NAME: FiscalQuarterWidget
        INFOPLIST_FILE: FiscalQuarterWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fiscal Quarter
        CODE_SIGN_ENTITLEMENTS: FiscalQuarterWidget/FiscalQuarterWidgetMac.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  FiscalQuarterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FiscalQuarterTests
      - FiscalQuarterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fiscalquarter.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  FiscalQuarteriOS:
    type: application
    platform: iOS
    # Installed as FiscalQuarter.app, like the Mac app. Without this XcodeGen names it after the target.
    productName: FiscalQuarter
    sources:
      - path: FiscalQuarteriOS
        excludes: ["*.entitlements"]
      - FiscalQuarterCore
      - FiscalQuarterUI
      - FiscalQuarterApp/AppearanceEditor.swift
      - FiscalQuarterApp/CalendarModel.swift
      - FiscalQuarterApp/QuarterClock.swift
      - FiscalQuarterApp/YearPicture.swift
    dependencies:
      - target: FiscalQuarterWidgetiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fiscalquarter.ios
        PRODUCT_NAME: FiscalQuarter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fiscal Quarter
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FiscalQuarteriOS/FiscalQuarteriOS.entitlements
        CODE_SIGN_STYLE: Automatic

  FiscalQuarterWidgetiOS:
    type: app-extension
    platform: iOS
    productName: FiscalQuarterWidget
    sources:
      - path: FiscalQuarterWidget
        excludes: [Info.plist, "*.entitlements"]
      - FiscalQuarterCore
      - FiscalQuarterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fiscalquarter.ios.widget
        PRODUCT_NAME: FiscalQuarterWidget
        INFOPLIST_FILE: FiscalQuarterWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fiscal Quarter
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FiscalQuarterWidget/FiscalQuarterWidgetiOS.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

schemes:
  FiscalQuarter:
    build:
      targets:
        FiscalQuarter: all
        FiscalQuarterTests: [test]
    test:
      targets: [FiscalQuarterTests]
  FiscalQuarteriOS:
    build:
      targets:
        FiscalQuarteriOS: all
